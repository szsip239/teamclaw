services:
  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    container_name: teamclaw-init
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net
    restart: "no"

  # ── Go API backend ────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teamclaw-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-teamclaw}:${POSTGRES_PASSWORD:-teamclaw_dev_2024}@postgres:5432/${POSTGRES_DB:-teamclaw}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      JWT_ACCESS_EXPIRY: "${JWT_ACCESS_EXPIRY:-15m}"
      JWT_REFRESH_EXPIRY: "${JWT_REFRESH_EXPIRY:-7d}"
      JWT_ISSUER: "${JWT_ISSUER:-teamclaw}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      PORT: "3200"
      GIN_MODE: "release"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-net
    volumes:
      - ./server/configs:/app/configs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── Next.js frontend ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: "http://api:3200"
    container_name: teamclaw-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      # Server-side rewrite target — Next.js proxies /api/v1/* to the Go backend.
      # The browser always uses relative URLs (/api/v1/...) which Next.js forwards here.
      INTERNAL_API_URL: "http://api:3200"
      # NEXT_PUBLIC_API_URL left unset so browser uses relative URLs (proxied by Next.js or Nginx).
      NEXT_PUBLIC_API_URL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - data-net

  postgres:
    image: postgres:17-alpine
    container_name: teamclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamclaw_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-teamclaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamclaw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamclaw-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: teamclaw-nginx
    restart: unless-stopped
    profiles: [nginx]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_SSL_CERT: ${NGINX_SSL_CERT:-server.crt}
      NGINX_SSL_KEY: ${NGINX_SSL_KEY:-server.key}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/cert:/etc/nginx/cert:ro
    depends_on:
      - app
      - api
    networks:
      - data-net

volumes:
  postgres-data:
  redis-data:

networks:
  data-net:
    driver: bridge
    name: teamclaw-net   # Fixed name — immune to project-prefix differences across platforms
