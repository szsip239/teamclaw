services:
  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    container_name: teamclaw-init
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-teamclaw}:${POSTGRES_PASSWORD:-teamclaw_dev_2024}@postgres:5432/${POSTGRES_DB:-teamclaw}?schema=public'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net
    volumes:
      # Read-only mount so seed.ts can scan SKILL.md frontmatter and
      # populate the Skill table. Matches the app service mount.
      - ./data/skills:/app/data/skills:ro
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamclaw-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3100}:3100'
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-teamclaw}:${POSTGRES_PASSWORD:-teamclaw_dev_2024}@postgres:5432/${POSTGRES_DB:-teamclaw}?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_PRIVATE_KEY: '${JWT_PRIVATE_KEY}'
      JWT_PUBLIC_KEY: '${JWT_PUBLIC_KEY}'
      JWT_ACCESS_EXPIRY: '${JWT_ACCESS_EXPIRY:-15m}'
      JWT_REFRESH_EXPIRY: '${JWT_REFRESH_EXPIRY:-7d}'
      JWT_ISSUER: '${JWT_ISSUER:-teamclaw}'
      ENCRYPTION_KEY: '${ENCRYPTION_KEY}'
      NEXT_PUBLIC_APP_URL: ''
      NODE_ENV: production
      DEFAULT_MODEL_PROVIDER: '${DEFAULT_MODEL_PROVIDER:-anthropic}'
      DEFAULT_MODEL_API_KEY: '${DEFAULT_MODEL_API_KEY:-}'
      DEFAULT_MODEL_BASE_URL: '${DEFAULT_MODEL_BASE_URL:-https://api.anthropic.com}'
      DEFAULT_MODEL_API_TYPE: '${DEFAULT_MODEL_API_TYPE:-anthropic-messages}'
      TEAMCLAW_DATA_DIR: '${TEAMCLAW_DATA_DIR:-/Users/clawdbot/.teamclaw/instances}'
      DEFAULT_OPENCLAW_IMAGE: '${DEFAULT_OPENCLAW_IMAGE:-alpine/openclaw:latest}'
      DOCKER_NETWORK: 'teamclaw-net'
      RAG_SERVICE_URL: 'http://rag:8000'
      RAG_SERVICE_SECRET: '${RAG_SERVICE_SECRET:-teamclaw-rag-secret-2024}'
      LLM_API_KEY: '${LLM_API_KEY:-}'
      DASHSCOPE_API_KEY: '${DASHSCOPE_API_KEY:-}'
      LLM_BASE_URL: '${LLM_BASE_URL:-}'
      LLM_MODEL: '${LLM_MODEL:-}'
      SILICONFLOW_API_KEY: '${SILICONFLOW_API_KEY:-}'
      SILICONFLOW_EMBEDDING_URL: '${SILICONFLOW_EMBEDDING_URL:-}'
      SILICONFLOW_EMBEDDING_MODEL: '${SILICONFLOW_EMBEDDING_MODEL:-}'
      PADDLEOCR_TOKEN: '${PADDLEOCR_TOKEN:-}'
      PADDLEOCR_MODEL: '${PADDLEOCR_MODEL:-}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-net
    group_add:
      - '${DOCKER_GID:-0}' # GID of docker.sock owner inside container (0=root on macOS)
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./data/skills:/app/data/skills
      - ${HOME}/.openclaw:${HOME}/.openclaw
      - ${TEAMCLAW_DATA_DIR:-/Users/clawdbot/.teamclaw/instances}:${TEAMCLAW_DATA_DIR:-/Users/clawdbot/.teamclaw/instances}
      - /tmp:/tmp:ro
      # Mount for external instance MEDIA images (e.g. OpenClaw skills output).
      # Set EXTERNAL_MEDIA_DIR to the OpenClaw installation's parent directory.
      - ${EXTERNAL_MEDIA_DIR:-/tmp/no-extra-mount}:${EXTERNAL_MEDIA_DIR:-/tmp/no-extra-mount}:ro
      - kb-data:/app/data/knowledge-bases
      - rag-output:/app/ingestion_output

  rag:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: teamclaw-rag
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-teamclaw}:${POSTGRES_PASSWORD:-teamclaw_dev_2024}@postgres:5432/${POSTGRES_DB:-teamclaw}'
      RAG_SERVICE_SECRET: '${RAG_SERVICE_SECRET:-teamclaw-rag-secret-2024}'
      LLM_API_KEY: '${LLM_API_KEY:-}'
      DASHSCOPE_API_KEY: '${DASHSCOPE_API_KEY:-}'
      LLM_BASE_URL: '${LLM_BASE_URL:-}'
      LLM_MODEL: '${LLM_MODEL:-}'
      SILICONFLOW_API_KEY: '${SILICONFLOW_API_KEY:-}'
      SILICONFLOW_EMBEDDING_URL: '${SILICONFLOW_EMBEDDING_URL:-}'
      SILICONFLOW_EMBEDDING_MODEL: '${SILICONFLOW_EMBEDDING_MODEL:-}'
      SILICONFLOW_EMBEDDING_BATCH_SIZE: '${SILICONFLOW_EMBEDDING_BATCH_SIZE:-10}'
      PADDLEOCR_TOKEN: '${PADDLEOCR_TOKEN:-}'
      PADDLEOCR_MODEL: '${PADDLEOCR_MODEL:-}'
      PADDLEOCR_JOB_URL: '${PADDLEOCR_JOB_URL:-}'
      PADDLEOCR_RETRY_ATTEMPTS: '${PADDLEOCR_RETRY_ATTEMPTS:-3}'
      PADDLEOCR_RETRY_BACKOFF: '${PADDLEOCR_RETRY_BACKOFF:-5}'
      PADDLEOCR_POLL_INTERVAL: '${PADDLEOCR_POLL_INTERVAL:-5}'
      PADDLEOCR_STALL_TIMEOUT: '${PADDLEOCR_STALL_TIMEOUT:-180}'
      PADDLEOCR_JOB_TIMEOUT: '${PADDLEOCR_JOB_TIMEOUT:-1800}'
      PADDLEOCR_CHUNK_PAGE_THRESHOLD: '${PADDLEOCR_CHUNK_PAGE_THRESHOLD:-48}'
      PADDLEOCR_CHUNK_SIZE: '${PADDLEOCR_CHUNK_SIZE:-40}'
      DOCUMENT_CHAPTER_SUMMARY_CHUNK_SIZE: '${DOCUMENT_CHAPTER_SUMMARY_CHUNK_SIZE:-40}'
      DOCUMENT_PROFILE_MAX_TOKENS: '${DOCUMENT_PROFILE_MAX_TOKENS:-384}'
      DOCUMENT_CHAPTER_SUMMARY_MAX_TOKENS: '${DOCUMENT_CHAPTER_SUMMARY_MAX_TOKENS:-4096}'
      PGVECTOR_EMBED_DIM: '${PGVECTOR_EMBED_DIM:-1024}'
      INGEST_DEFAULT_WORKERS: '${INGEST_DEFAULT_WORKERS:-4}'
      INGEST_MAX_WORKERS: '${INGEST_MAX_WORKERS:-12}'
      UPLOAD_RENDER_DPI: '${UPLOAD_RENDER_DPI:-110}'
      UPLOAD_RENDER_MAX_PIXELS: '${UPLOAD_RENDER_MAX_PIXELS:-900000}'
      UPLOAD_RENDER_JPEG_QUALITY: '${UPLOAD_RENDER_JPEG_QUALITY:-72}'
      LLM_RENDER_MAX_PIXELS: '${LLM_RENDER_MAX_PIXELS:-640000}'
      LLM_RENDER_JPEG_QUALITY: '${LLM_RENDER_JPEG_QUALITY:-60}'
      MULTI_DOC_TOTAL_PAGE_BUDGET: '${MULTI_DOC_TOTAL_PAGE_BUDGET:-15}'
      MULTI_DOC_PER_DOC_PAGE_LIMIT: '${MULTI_DOC_PER_DOC_PAGE_LIMIT:-6}'
      MULTI_DOC_SINGLE_DOC_PAGE_LIMIT: '${MULTI_DOC_SINGLE_DOC_PAGE_LIMIT:-30}'
    volumes:
      - kb-data:/app/data/knowledge-bases
      - rag-output:/app/ingestion_output
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg17
    container_name: teamclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamclaw_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-teamclaw}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-teamclaw}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamclaw-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - data-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: teamclaw-nginx
    restart: unless-stopped
    profiles: [nginx]
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
      - '${IDEAFLOW_HTTPS_PORT:-18999}:18999'
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_SSL_CERT: ${NGINX_SSL_CERT:-server.crt}
      NGINX_SSL_KEY: ${NGINX_SSL_KEY:-server.key}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/cert:/etc/nginx/cert:ro
    depends_on:
      - app
    networks:
      - data-net

volumes:
  postgres-data:
  redis-data:
  kb-data:
  rag-output:

networks:
  data-net:
    driver: bridge
    name: teamclaw-net # Fixed name — immune to project-prefix differences across platforms
